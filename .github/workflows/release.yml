name: Release

on:
  workflow_dispatch:
    inputs:
      component:
        description: "Component release stream"
        required: true
        type: choice
        options: [core, web, macos]
      version:
        description: "Approved component version without a prefix"
        required: true
        type: string
      action:
        description: "Release action"
        required: true
        type: choice
        default: verify
        options:
          - verify
          - tag-and-create-draft
          - create-draft
          - publish-draft
          - deploy-production
      run_ai_smoke:
        description: "Run one provider-backed AI generation before promoting the web deployment"
        required: false
        type: boolean
        default: false
      fallow-base:
        description: "Base branch for the changed-code Fallow release audit"
        required: false
        type: string
        default: development

permissions:
  contents: read

concurrency:
  group: ${{ inputs.action == 'deploy-production' && 'production-deploy' || format('release-{0}-{1}', inputs.component, inputs.version) }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify component, notes and exact tag revision
        env:
          RELEASE_COMPONENT: ${{ inputs.component }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_ACTION: ${{ inputs.action }}
        run: node scripts/verify-release.mjs --component "$RELEASE_COMPONENT" --version "$RELEASE_VERSION" --action "$RELEASE_ACTION"

  compatibility:
    needs: metadata
    uses: ./.github/workflows/native-tooling.yml
    with:
      release-component: ${{ inputs.component }}

  web:
    needs: metadata
    if: inputs.component == 'web'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Web quality gate
        run: npm run check
      - name: Production build
        run: npm run build:ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Full release browser gate
        run: npm run test:browser:release
      - name: Verify built Web identity
        run: node scripts/release/verify-build.mjs web --require-clean
      - name: Fallow release audit
        env:
          FALLOW_AGENT_SOURCE: github_actions
          FALLOW_BASE: ${{ inputs.fallow-base }}
        run: npm run --silent fallow:audit -- --base "origin/$FALLOW_BASE" --gate new-only
      - uses: actions/upload-artifact@v4
        with:
          name: Web-identity-${{ github.sha }}
          path: apps/web/build/client/build-identity.json
          if-no-files-found: error

  gate:
    name: Component release gate
    needs: [metadata, compatibility, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require shared compatibility and selected application gate
        env:
          METADATA: ${{ needs.metadata.result }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
          WEB: ${{ needs.web.result }}
          COMPONENT: ${{ inputs.component }}
        run: |
          test "$METADATA" = success
          test "$COMPATIBILITY" = success
          if [ "$COMPONENT" = web ]; then test "$WEB" = success; else test "$WEB" = skipped; fi

  release:
    name: Component publication action
    needs: gate
    if: inputs.action == 'tag-and-create-draft' || inputs.action == 'create-draft' || inputs.action == 'publish-draft'
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Configure Git
        if: inputs.action == 'tag-and-create-draft'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Download verified macOS archive
        if: inputs.component == 'macos' && inputs.action != 'publish-draft'
        uses: actions/download-artifact@v4
        with:
          name: Artifact-macOS-${{ github.sha }}
          path: release-artifacts
      - name: Download Web build identity
        if: inputs.component == 'web' && inputs.action != 'publish-draft'
        uses: actions/download-artifact@v4
        with:
          name: Web-identity-${{ github.sha }}
          path: release-artifacts
      - name: Execute separately authorized publication action
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMPONENT: ${{ inputs.component }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_ACTION: ${{ inputs.action }}
        run: node scripts/release/act.mjs

  deploy-production:
    name: Deploy production from verified commit
    needs: gate
    if: inputs.component == 'web' && inputs.action == 'deploy-production'
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: read
    env:
      COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
      COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
      COOLIFY_GIT_BRANCH: main
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      DEPLOY_SHA: ${{ github.sha }}
      EXPECTED_API_CONTRACT_VERSION: "1"
      DEPLOYMENT_API_URL: ${{ vars.PRODUCTION_API_URL }}
      DEPLOYMENT_WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
      VERCEL_CLI_VERSION: "54.21.1"
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Production deploys must run from main. Current ref: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Recheck exact Web tag before deployment
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/verify-release.mjs --component web --version "$RELEASE_VERSION" --action deploy-production

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"

      - name: Build staged web deployment
        env:
          VITE_APP_COMMIT: ${{ github.sha }}
        run: vercel build --prod --token="${VERCEL_TOKEN}"

      - name: Deploy staged web without production domains
        shell: bash
        run: |
          set -euo pipefail
          staged_url="$(vercel deploy --prebuilt --prod --skip-domain --yes --no-color --meta "artifactBuildSha=${DEPLOY_SHA}" --token="${VERCEL_TOKEN}")"
          if [[ ! "${staged_url}" =~ ^https:// ]]; then
            echo "Vercel did not return a deployment URL: ${staged_url}" >&2
            exit 1
          fi
          echo "STAGED_WEB_URL=${staged_url}" >> "${GITHUB_ENV}"

      - name: Verify staged web deployment
        shell: bash
        env:
          VERIFY_TARGET: web
        run: |
          set -euo pipefail
          staged_html="$(mktemp)"
          trap 'rm -f "${staged_html}"' EXIT
          vercel curl --yes / --deployment "${STAGED_WEB_URL}" -- \
            --silent --show-error --fail --location --output "${staged_html}"
          WEB_DEPLOYMENT_HTML_PATH="${staged_html}" node scripts/deploy/verify-production.mjs

      - name: Deploy VPS stack from the verified commit
        id: coolify
        run: node scripts/deploy/coolify.mjs

      - name: Verify production API revision and contract
        env:
          VERIFY_TARGET: api
        run: node scripts/deploy/verify-production.mjs

      - name: Run provider-backed AI smoke test
        if: inputs.run_ai_smoke
        env:
          API_SMOKE_BASE_URL: ${{ vars.PRODUCTION_API_URL }}
          API_SMOKE_PROVIDER: openai
          API_SMOKE_TIMEOUT_MS: "120000"
          API_SMOKE_TOKEN: ${{ secrets.PRODUCTION_API_SMOKE_TOKEN }}
        run: node apps/api/scripts/smoke.mjs

      - name: Promote staged web deployment
        run: vercel promote "${STAGED_WEB_URL}" --yes --token="${VERCEL_TOKEN}"

      - name: Verify production web domain
        env:
          VERIFY_TARGET: web
        run: node scripts/deploy/verify-production.mjs

      - name: Summarize production deployment
        shell: bash
        run: |
          echo "### Production deployment" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Commit: \`${DEPLOY_SHA}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Coolify deployment: \`${{ steps.coolify.outputs.deployment-uuid }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Staged Vercel deployment: ${STAGED_WEB_URL}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Production web: ${DEPLOYMENT_WEB_URL}" >> "${GITHUB_STEP_SUMMARY}"
